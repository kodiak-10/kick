<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KICK AI · 把每一次训练变成进步</title><style>
:root{--ink:#17382b;--muted:#77847b;--green:#215941;--lime:#d4f376;--bg:#f5f6f1;--line:#e1e7dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #98bd31;outline-offset:3px}button{border:0;background:none;color:inherit}.shell{display:grid;grid-template-columns:222px 1fr;min-height:100vh}.sidebar{background:#122f24;color:#d0ded5;padding:38px 22px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-weight:900;font-size:29px;color:white;letter-spacing:-1px}.brand i{font-style:normal;color:var(--lime)}.brand-sub{font-size:10px;letter-spacing:3px;margin:7px 0 52px;color:#9fb6a7}.nav{display:grid;gap:10px}.nav button{text-align:left;padding:14px 16px;border-radius:10px;color:#a6bdaf}.nav button.active{background:var(--lime);color:#143223;font-weight:700}.nav button span{display:inline-block;width:27px}.side-bottom{margin-top:auto;font-size:12px;line-height:1.9;color:#9db5a6}.side-bottom strong{color:white;display:block;font-size:14px}main{min-width:0;padding:28px 46px 45px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:30px;font-size:12px;color:var(--muted)}.avatar{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e4ebdc;color:var(--green);margin-left:12px}.badge{display:inline-block;background:#eaf0e6;border:1px solid #dce6d5;padding:5px 9px;border-radius:5px;font-size:11px;font-weight:500;vertical-align:middle}.badge.new{background:#faf1dd;color:#8b681c;border-color:#ecdfbe}.eyebrow{font-size:11px;letter-spacing:2px;color:#748777;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:6px 0 26px}h1{font-size:30px;letter-spacing:-1px;margin:8px 0 10px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}p{line-height:1.8;margin:8px 0;color:var(--muted)}.btn{padding:12px 19px;border-radius:8px;background:var(--green);color:white;display:inline-flex;justify-content:center;align-items:center;gap:10px;font-weight:600;font-size:13px}.btn.light{background:var(--lime);color:var(--ink)}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.hero{background:#1c4935;border-radius:18px;padding:36px;color:white;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;overflow:hidden;min-height:276px}.hero h2{font-size:34px;line-height:1.35;margin:14px 0}.hero p{color:#b6cdbb;font-size:13px;max-width:340px}.hero .eyebrow{color:var(--lime)}.hero .btn{margin-top:16px}.pitch{width:100%;height:215px;align-self:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}.grid.three{grid-template-columns:repeat(3,1fr)}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:24px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:30px 0 16px}.section-title h2{margin:0}.textbtn{font-size:12px;color:var(--green);text-decoration:underline;text-underline-offset:4px}.stat{font-size:32px;font-weight:700;letter-spacing:-1px;margin:12px 0 0}.stat small{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.sub{font-size:12px;color:var(--muted);line-height:1.8}.iconbox{background:#eef2e7;border-radius:9px;width:44px;height:44px;display:grid;place-items:center;font-size:20px}.listrow{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.listrow .grow{flex:1}.listrow p{font-size:12px;margin:4px 0 0}.footer{font-size:11px;color:#96a090;margin-top:30px;display:flex;justify-content:space-between;gap:14px}.notice{padding:14px 18px;border-radius:8px;background:#eef2e5;color:#536743;font-size:12px;line-height:1.7;margin:16px 0}.notice.warn{background:#fbf1de;color:#8c6425}.steps{display:flex;gap:8px;margin:15px 0 25px}.step{flex:1;border-top:3px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}.step.active{border-color:var(--green);color:var(--green)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{border:1px solid var(--line);border-radius:10px;padding:20px 14px;text-align:left;background:white}.choice.selected{border:2px solid var(--green);padding:19px 13px;background:#f1f6eb}.choice b{display:block;margin-bottom:10px}.drop{border:1.5px dashed #bbc9b0;padding:30px 20px;background:#fafcf6;text-align:center;border-radius:12px;margin-top:20px}.drop label{cursor:pointer;display:inline-block}.drop input{max-width:100%;margin-top:12px}.field{display:block;margin:15px 0}.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:white;margin-top:8px;color:var(--ink)}.field textarea{min-height:95px;resize:vertical}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.score{font-size:65px;font-weight:700;letter-spacing:-3px;line-height:1}.score small{font-size:15px;letter-spacing:0;color:var(--muted)}.bars{margin-top:24px}.bar{height:6px;background:#eef1e8;border-radius:10px;margin:8px 0 17px}.bar i{display:block;background:var(--green);height:100%;border-radius:10px}.evidence{background:#173e2d;border-radius:10px;color:white;padding:18px}.evidence p{color:#b7cbb9}.evidence .pitch{height:160px}.timeline{display:flex;gap:8px;margin-top:14px}.timeline button{flex:1;border:1px solid #63816b;border-radius:6px;padding:9px;color:#d0e2d2;font-size:12px}.timeline button.active{background:var(--lime);color:var(--ink)}.task{padding:17px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.task input{accent-color:var(--green);width:19px;height:19px}.task label{flex:1;line-height:1.6}.task small{display:block;color:var(--muted);margin-top:5px}.progress{height:7px;background:#e5ecdf;border-radius:10px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:var(--green);transition:width .2s}.empty{text-align:center;padding:45px 20px}.empty p{margin:15px 0}.tagline{font-size:13px;margin-bottom:20px;color:var(--muted)}.case-list{display:grid;gap:16px}.case-list article{border-top:1px solid var(--line);padding-top:16px}.case-list strong{display:block;margin-bottom:5px}video{width:100%;max-height:290px;background:#10281d;border-radius:8px;margin-top:14px}.hidden{display:none!important}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#153b2b;color:white;padding:13px 23px;border-radius:9px;z-index:20;box-shadow:0 8px 25px #0002;max-width:90vw;font-size:13px}.record-btn{text-align:left;flex:1}.record-btn:hover h3{ text-decoration:underline}.intro-num{font-size:11px;color:#7c966e;font-weight:700;margin-bottom:12px}.mini{font-size:11px}.pill{border:1px solid var(--line);padding:8px 12px;border-radius:20px;background:white;font-size:12px}.pill.active{background:var(--green);color:white}
@media(min-width:1500px){main{padding-left:65px;padding-right:65px}}@media(max-width:1000px){main{padding:25px}.shell{grid-template-columns:182px 1fr}.sidebar{padding:30px 15px}.hero{padding:25px}.hero h2{font-size:28px}.grid{gap:15px}.card{padding:20px}}@media(max-width:720px){.shell{display:block}.sidebar{position:relative;height:auto;padding:20px}.brand-sub,.side-bottom{display:none}.brand{font-size:24px}.nav{display:flex;gap:5px;margin-top:17px;overflow:auto}.nav button{padding:10px;white-space:nowrap;font-size:12px}.nav button span{width:18px}.topbar{padding-bottom:15px}.hero{grid-template-columns:1fr}.hero .pitch{height:150px}.grid,.grid.three{grid-template-columns:1fr}.heading{align-items:flex-start}h1{font-size:26px}main{padding:20px}.choices{gap:8px}.choice{padding:15px 9px}.choice.selected{padding:14px 8px}.choice .sub{font-size:11px}.footer{display:block;line-height:1.9}.heading .badge{white-space:nowrap}.steps{gap:5px}.step{font-size:10px}.card{padding:20px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">KICK <i>AI</i> ↗</div><div class="brand-sub">TRAIN WITH INTENTION</div><nav class="nav" aria-label="主导航"><button data-view="home"><span>◈</span>训练首页</button><button data-view="analyze"><span>⊕</span>动作分析</button><button data-view="plan"><span>▤</span>训练计划</button><button data-view="history"><span>◷</span>训练记录</button><button data-view="about"><span>◎</span>项目说明</button></nav><div class="side-bottom"><strong>每一脚，都有进步。</strong>从看懂动作，到练好下一组。<br><br>交互演示 · V1.0<br>基于熊文 KICK AI 项目作品集</div></aside><main><header class="topbar"><span>KICK AI / YOUR TRAINING SPACE</span><span>本地交互原型 <span class="avatar">K</span></span></header><div id="app"></div><footer class="footer"><span>理解动作 · 找到证据 · 回到球场</span><span>示例数据仅用于展示产品流程，不代表真实分析能力</span></footer></main></div><div id="toast" role="status" class="hidden"></div>
<script>
'use strict';
const app=document.getElementById('app');let view='home',action='传球',file=null,fileUrl='',sample=false,phase=0,result=null,filter='全部',frame=0,timer=null;let records=[],plan=null;let storageOK=true;
try{records=JSON.parse(localStorage.getItem('kick-demo-records')||'[]');plan=JSON.parse(localStorage.getItem('kick-demo-plan')||'null');if(!Array.isArray(records))throw Error('数据格式错误');}catch(e){records=[];plan=null;storageOK=false;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem('kick-demo-records',JSON.stringify(records));localStorage.setItem('kick-demo-plan',JSON.stringify(plan));}catch(e){storageOK=false;toast('浏览器未能保存数据，本次操作仅在当前页面有效');}}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>el.classList.add('hidden'),3500);}
function pitch(n=0){return `<svg class="pitch" viewBox="0 0 430 225" role="img" aria-label="足球动作示意图，非真实识别画面"><defs><pattern id="grass${n}" width="70" height="225" patternUnits="userSpaceOnUse"><rect width="35" height="225" fill="#ffffff" opacity=".025"/></pattern></defs><rect x="10" y="10" width="410" height="205" rx="10" fill="url(#grass${n})" stroke="#75967a"/><g stroke="#75967a" fill="none" opacity=".7"><path d="M215 10V215M10 65H80V160H10M420 65H350V160H420M10 92H38V133H10M420 92H392V133H420"/><circle cx="215" cy="112" r="41"/></g><path d="M150 160Q218 50 333 78" fill="none" stroke="#d4f376" stroke-width="2" stroke-dasharray="6 6"/><circle cx="333" cy="78" r="8" fill="#d4f376"/><g transform="translate(${150+n*35},${120-n*8})" stroke="#e9f9d0" stroke-width="5" stroke-linecap="round"><circle cy="-25" r="8" fill="#e9f9d0" stroke="none"/><path d="M0 -12L-4 12L-23 36M-4 12L23 27M0 -6L-19 6M0 -6L17 -14" fill="none"/><circle cx="33" cy="32" r="7" fill="#d4f376" stroke="none"/></g><text x="27" y="199" fill="#b7d0af" font-size="10" letter-spacing="2">MOTION STUDY / DEMO</text></svg>`;}
function title(k,t,sub,extra=''){return `<div class="eyebrow">${k}</div><div class="heading"><div><h1>${t}</h1><p>${sub}</p></div>${extra}</div>`;}
function navigate(v){view=v;if(v==='analyze'&&phase===2)phase=0;render();window.scrollTo(0,0);}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));app.innerHTML=({home,analyze,report,plan:planView,history,about})[view]();if(!storageOK)app.insertAdjacentHTML('afterbegin','<div class="notice warn">本地保存不可用或历史数据无法读取；当前数据仅在本页会话有效。</div>');bind();}
function home(){return title('LET’S GET BETTER','让下一脚，更有方向。','从一段训练视频开始，看懂动作，再回到球场。','<span class="badge">个人训练空间</span>')+`<section class="hero"><div><div class="eyebrow">YOUR NEXT GOOD KICK</div><h2>不止一个分数。<br>找到真正值得练的细节。</h2><p>选择动作，回看关键时刻，把反馈变成下一组可执行的训练。</p><button class="btn light" data-go="analyze">开始动作分析 <span>↗</span></button></div>${pitch(0)}</section><div class="grid three"><div class="card"><div class="sub">已保存的演示报告</div><div class="stat">${records.length} <small>份</small></div></div><div class="card"><div class="sub">当前训练计划</div><div class="stat">${plan?plan.done.filter(Boolean).length:0}<small> / ${plan?3:0} 项完成</small></div></div><div class="card"><div class="sub">本次训练原则</div><h2 style="margin:16px 0 0">先确认，再反馈 ↗</h2></div></div><div class="grid"><section class="card"><div class="row"><h2>从你的训练目标开始</h2><span class="badge">核心功能</span></div>${['传球','射门','长视频'].map((a,i)=>`<div class="listrow"><div class="iconbox">${['↗','◎','▸'][i]}</div><div class="grow"><h3>${a}${i===2?' <span class="badge">Beta</span>':''}</h3><p>${['提高方向控制，让接球队友更舒服','观察支撑与触球，让发力更连贯','先锁定球员，再查看训练片段'][i]}</p></div><button class="btn ghost" data-actionstart="${a}" aria-label="开始${a}分析">→</button></div>`).join('')}</section><section class="card"><div class="row"><h2>下一组，专注一件事</h2><span class="badge new">新增设计</span></div><p>把报告里的关键问题放进训练计划，练完记录感受，再拍一段视频复盘。</p><div class="notice">${plan?'你已有一份训练计划，继续完成今天的练习。':'完成一次示例分析，即可生成配套训练计划。'}</div><div class="listrow"><div class="iconbox">01</div><div><h3>看懂关键动作</h3><p>每条反馈都对应一个证据时刻。</p></div></div><div class="listrow"><div class="iconbox">02</div><div><h3>带着目标再练一次</h3><p>明确次数、注意点与复盘问题。</p></div></div><button class="textbtn" data-go="${plan?'plan':'analyze'}">${plan?'查看训练计划':'体验完整流程'} ↗</button></section></div>`;}
function analyze(){return title('01 / ANALYZE','开始一次有目标的分析','先告诉我们你练的动作，再选择训练视频。')+`<div class="steps"><div class="step active">01 选择动作与视频</div><div class="step ${phase===1?'active':''}">02 确认分析条件</div><div class="step">03 查看反馈与训练</div></div><div class="grid" style="margin-top:0"><section class="card"><h2>你想练好哪个动作？</h2><div class="choices">${['传球','射门','长视频'].map(a=>`<button class="choice ${action===a?'selected':''}" data-action="${a}" aria-pressed="${action===a}"><b>${a} ${a==='长视频'?'· Beta':''}</b><span class="sub">${a==='传球'?'方向与触球控制':a==='射门'?'支撑与发力连贯':'锁定单一目标球员'}</span></button>`).join('')}</div><div class="drop"><div style="font-size:28px">↑</div><h3>导入训练视频</h3><p class="sub">本地预览，不会上传到服务器。支持浏览器可播放的视频，最大 200 MB。</p><label class="sub">选择本地文件 <input id="videoFile" type="file" accept="video/*"></label><div id="fileInfo" class="sub">${file?esc(file.name):sample?'已选择内置示例场景':'还没有视频？可以先体验示例流程。'}</div><button class="textbtn" id="sample" style="margin-top:16px">使用示例场景 →</button></div>${fileUrl?`<video controls src="${esc(fileUrl)}" id="previewVideo"></video><p class="sub">本地视频仅用于预览；后续分析仍为示例数据。</p>`:''}<div id="fileError" role="alert" class="notice warn hidden"></div></section><section class="card"><h2>拍得清楚，反馈才有依据</h2><div class="case-list"><article><strong>01 全身与足球都入镜</strong><p class="sub">保留支撑脚、触球脚与足球运动的完整范围。</p></article><article><strong>02 尽量固定机位</strong><p class="sub">避免逆光、遮挡和快速移动镜头。</p></article><article><strong>03 一段视频，聚焦一个动作</strong><p class="sub">保留助跑、触球和随动，方便回看完整过程。</p></article></div>${action==='长视频'?'<label class="field sub">锁定目标球员（演示）<select id="player"><option value="">请选择目标球员</option><option value="7">7 号 · 绿色上衣</option><option value="10">10 号 · 白色上衣</option></select></label><div class="notice warn">Beta：未锁定目标球员前，不提供反馈。此原型不输出跑动距离和传射次数。</div>':''}<label class="field sub">演示结果场景<select id="scenario"><option value="good">信息充分 · 展示示例反馈</option><option value="low">画面模糊 · 限制评分</option><option value="mismatch">动作不一致 · 重新选择</option></select></label><div class="notice">这是交互演示。不会调用视觉模型；选择文件与示例场景都会使用明确标注的演示结果。</div><button class="btn" id="run" ${!sample&&!file?'disabled':''}>查看演示反馈 →</button></section></div>`;}
function report(){const r=result;if(!r)return `<div class="empty"><h2>还没有分析结果</h2><button class="btn" data-go="analyze">开始分析</button></div>`;const good=r.scenario==='good';return title('02 / FEEDBACK',good?'看懂动作，练好下一组。':'这次先不急着打分。',`${esc(r.action)}${r.player?' · 目标球员 '+esc(r.player)+' 号':''} · ${esc(r.source)} · ${esc(r.date)}`,'<span class="badge">示例报告</span>')+`<div class="notice ${good?'':'warn'}">${good?'演示场景：信息充分。以下分数、动作证据与建议均为预设示例，并非对上传视频的识别。':r.scenario==='low'?'演示场景：画面信息不足，无法可靠判断触球与支撑动作；不输出评分或针对性建议。':'演示场景：系统判断与所选动作不一致；请确认动作类型后重新开始，不输出评分。'}</div>${good?`<div class="grid"><section class="card"><div class="row"><h2>${r.action==='长视频'?'目标片段反馈':'动作表现'}</h2><span class="badge">示例值</span></div><div class="score">${r.action==='射门'?76:78}<small> / 100</small></div><p>先聚焦：${r.action==='射门'?'支撑脚稳定与随动连贯':'支撑脚朝向与触球位置'}</p><div class="bars">${[['支撑稳定',72],['触球控制',81],['动作连贯',80]].map(([t,n])=>`<div class="row sub"><span>${t}</span><b>${n}</b></div><div class="bar"><i style="width:${n}%"></i></div>`).join('')}</div><div class="notice">可信度：示例“信息充分”状态。原型未验证识别准确率，不展示虚构准确率。</div></section><section class="card"><div class="row"><h2>关键动作证据</h2><span class="badge new">新增交互</span></div><div class="evidence">${pitch(frame)}<div class="row mini"><span>动作示意 · 不是视频识别画面</span><span>${['00:02','00:03','00:04'][frame]}</span></div><div class="timeline">${['支撑','触球','随动'].map((t,i)=>`<button class="${frame===i?'active':''}" data-frame="${i}">${t}</button>`).join('')}</div></div><h3 style="margin-top:18px">${['支撑脚略偏离目标方向','触球位置需要保持稳定','随动朝目标方向延伸'][frame]}</h3><p class="sub">${['示例观察：支撑方向与出球方向不一致。下一组用地面标记线检查脚尖朝向。','示例观察：连续动作中的触球点不一致。先用低速、短距离练习保持接触位置。','示例观察：触球后动作偏早停止。下一组降低力量，保持自然、连贯的随动。'][frame]}</p></section></div><section class="card" style="margin-top:22px"><div class="row"><div><h2>下一组，先练稳定再加速</h2><p class="sub">围绕本次示例反馈，安排 3 项练习；完成后记录感受并再次拍摄。</p></div><button class="btn" id="makePlan">${plan&&plan.reportId===r.id?'打开训练计划':'加入训练计划'} ↗</button></div></section>`:`<section class="card empty"><div style="font-size:38px">◎</div><h2 style="margin-top:20px">${r.scenario==='low'?'需要更清楚的动作证据':'先确认你练的动作'}</h2><p>${r.scenario==='low'?'重新拍摄时保留全身与足球，避免遮挡和逆光。':'请重新选择传球、射门或长视频，再查看对应流程。'}</p><button class="btn" data-go="analyze">重新选择与拍摄</button></section>`}<div class="toolbar"><button class="btn ghost" id="save">${records.some(x=>x.id===r.id)?'已保存到训练记录':'保存示例报告'}</button><button class="btn ghost" data-go="analyze">再分析一次</button></div>`;}
function tasks(){return plan?.action==='射门'?[['支撑脚定点练习','2 组 × 8 次 · 约 4 分钟','低速接近固定球，检查支撑脚方向。'],['低力量定点射门','3 组 × 6 次 · 约 6 分钟','使用较小力量，关注触球后的连贯随动。'],['拍摄一组复盘','1 组 × 3 次 · 约 2 分钟','保持相同机位，记录哪一次动作最稳定。']]:[['支撑脚定点练习','2 组 × 10 次 · 约 4 分钟','用地面标记线检查脚尖是否朝向目标。'],['短距离目标传球','3 组 × 8 次 · 约 6 分钟','保持低速，关注接触位置和出球方向。'],['拍摄一组复盘','1 组 × 3 次 · 约 2 分钟','保持相同机位，记录哪一次动作最稳定。']];}
function planView(){return title('03 / TRAINING','把反馈，带回球场。','每次专注一个问题，练完再回看。','<span class="badge new">新增设计</span>')+(!plan?`<section class="card empty"><h2>你的下一组训练，从一条反馈开始</h2><p>先完成一次“信息充分”的示例分析，再把建议加入训练计划。</p><button class="btn" data-go="analyze">开始动作分析 →</button></section>`:`<div class="grid"><section class="card"><div class="row"><h2>${esc(plan.action)} · 稳定性练习</h2><span class="badge">示例计划</span></div><p class="sub">约 12 分钟 · ${plan.done.filter(Boolean).length} / 3 已完成</p><div class="progress"><i style="width:${plan.done.filter(Boolean).length/3*100}%"></i></div>${tasks().map(([t,n,d],i)=>`<div class="task"><input id="task${i}" data-task="${i}" type="checkbox" ${plan.done[i]?'checked':''}><label for="task${i}"><strong>${t}</strong><small>${n}</small><small>${d}</small></label></div>`).join('')}<div class="notice">训练内容是产品演示建议，可按个人情况调整；不构成医学或临床结论。</div></section><section class="card"><h2>给下一次训练留一条线索</h2><p class="sub">哪一项更稳定了？哪个动作仍然难以控制？</p><label class="field sub">训练感受<textarea id="note" placeholder="例如：降低力量后，传球方向更稳定了。">${esc(plan.note||'')}</textarea></label><button class="btn ghost" id="saveNote">保存复盘</button><div class="notice">复盘保存在当前浏览器。下一次上传相同机位的视频，更容易比较动作变化。</div><button class="btn" data-go="analyze">拍完了，再分析一次 ↗</button></section></div>`);}
function history(){const rows=records.filter(r=>filter==='全部'||r.action===filter);return title('YOUR PROGRESS','每一次练习，都留下线索。','回看示例报告与限制提示，记录保存在当前浏览器。')+`<div class="toolbar" style="margin-bottom:20px">${['全部','传球','射门','长视频'].map(t=>`<button class="pill ${filter===t?'active':''}" data-filter="${t}">${t}</button>`).join('')}</div><section class="card">${rows.length?rows.map(r=>`<div class="listrow"><div class="iconbox">${r.scenario==='good'?'↗':'◎'}</div><button class="record-btn" data-record="${r.id}"><h3>${esc(r.action)} · ${r.scenario==='good'?'训练反馈':'反馈受限'}</h3><p class="sub">${esc(r.date)} · ${esc(r.source)} · 示例报告</p></button><span class="badge">${r.scenario==='good'?(r.action==='射门'?76:78)+' 分':'未评分'}</span></div>`).join(''):'<div class="empty"><h2>这里还没有训练记录</h2><p>查看演示反馈后，点击“保存示例报告”。</p><button class="btn" data-go="analyze">开始一次分析</button></div>'}</section>`;}
function about(){return title('PRODUCT CASE / WEN XIONG','KICK AI，足球训练反馈原型。','从普通训练视频，到可理解、可执行、可复盘的反馈。')+`<div class="notice">本 HTML 依据《Kick AI 项目作品集 · 熊文》5 页内容重构。作品集中的项目陈述不等于本次已验证的代码或模型能力。</div><div class="grid"><section class="card"><span class="badge">PDF 原有内容</span><h2 style="margin-top:18px">先确认动作，再形成反馈</h2><div class="case-list"><article><strong>用户与痛点</strong><p class="sub">个人训练者、青训教练、训练工作室；人工逐帧反馈耗时，模型结论难验证，通用建议难转成训练。</p></article><article><strong>产品原则</strong><p class="sub">动作先选后传；可靠性不足时限制输出；问题、证据、训练形成完整反馈；长视频先锁人。</p></article><article><strong>原项目结构</strong><p class="sub">作品集记录 SwiftUI 客户端、FastAPI 分析服务和 Python 视觉与规则层。本 HTML 是独立前端演示，未接入这些服务。</p></article><article><strong>原型与探索范围</strong><p class="sub">原型包括动作选择、本地视频导入、反馈和历史；长视频、球友圈、球场发现、私教入口属于探索模块。</p></article></div></section><section class="card"><span class="badge new">本次补充设计</span><h2 style="margin-top:18px">补齐“知道以后怎么练”</h2><div class="case-list"><article><strong>证据时刻切换</strong><p class="sub">按支撑、触球、随动查看示意证据和对应解释，后续可映射到真实视频时间点。</p></article><article><strong>训练计划与复盘</strong><p class="sub">从报告添加练习，勾选完成情况，记录训练感受；再次分析形成闭环。</p></article><article><strong>三种结果路径</strong><p class="sub">信息充分、画面信息不足、动作不一致；低可信场景不显示评分，也不生成针对性计划。</p></article><article><strong>演示范围</strong><p class="sub">离线单文件、响应式页面、本地视频预览、示例报告保存与筛选。没有真实 AI 分析、账户、上传、社交或球场服务。</p></article></div></section><section class="card"><h2>阶段问题与能力边界</h2><p class="sub">作品集记录：传球可能被误判为射门；长视频有等待与目标混淆问题；真机连接服务需验证。单次演示不能代表稳定准确率，单机位视觉不构成医学诊断。</p></section><section class="card"><h2>个人职责与交付</h2><p class="sub">熊文：结合足球经历拆解训练场景，梳理功能优先级，借助 AI 编程推进原型，记录误判、长视频和真机连接问题。本次新增功能仅代表演示设计，不回写为原项目已完成功能。</p></section></div>`;}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));document.querySelectorAll('[data-actionstart]').forEach(b=>b.onclick=()=>{action=b.dataset.actionstart;navigate('analyze')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{action=b.dataset.action;render()});document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{frame=+b.dataset.frame;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{result=records.find(r=>r.id===b.dataset.record);frame=0;navigate('report')});document.querySelectorAll('[data-task]').forEach(b=>b.onchange=()=>{plan.note=document.getElementById('note').value;plan.done[+b.dataset.task]=b.checked;persist();render()});const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};on('sample',()=>{if(fileUrl)URL.revokeObjectURL(fileUrl);file=null;fileUrl='';sample=true;render()});const input=document.getElementById('videoFile');if(input)input.onchange=()=>{const f=input.files[0];if(!f)return;if(!f.type.startsWith('video/')||f.size>200*1024*1024){const e=document.getElementById('fileError');e.textContent='请选择不超过 200 MB 的视频文件。';e.classList.remove('hidden');input.value='';return;}if(fileUrl)URL.revokeObjectURL(fileUrl);file=f;fileUrl=URL.createObjectURL(f);sample=false;render();};const video=document.getElementById('previewVideo');if(video)video.onerror=()=>{const e=document.getElementById('fileError');e.textContent='浏览器无法播放这个视频，请更换可播放的格式；本文件不会被分析。';e.classList.remove('hidden');document.getElementById('run').disabled=true;};on('run',()=>{const p=document.getElementById('player');if(p&&!p.value){toast('请先锁定目标球员');p.focus();return;}result={id:Date.now().toString()+Math.random().toString(36).slice(2,7),action,player:p?p.value:'',source:file?file.name:'内置示例场景',date:new Date().toLocaleString('zh-CN'),scenario:document.getElementById('scenario').value};phase=2;frame=0;navigate('report');});on('save',()=>{if(!records.some(r=>r.id===result.id)){records.unshift({...result});persist();}render();toast(storageOK?'示例报告已保存':'报告仅保留在当前页面');});on('makePlan',()=>{if(plan&&plan.reportId===result.id){navigate('plan');return;}if(plan&&!confirm('创建这份新计划会替换当前计划和复盘，是否继续？'))return;plan={reportId:result.id,action:result.action,done:[false,false,false],note:''};persist();navigate('plan');});on('saveNote',()=>{plan.note=document.getElementById('note').value;persist();toast(storageOK?'复盘已保存':'复盘仅保留在当前页面');});}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));render();
</script></body></html>
